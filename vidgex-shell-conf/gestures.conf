#############
### ЖЕСТЫ ###
#############

# Матричное переключение рабочих столов
gesture = 3, right, dispatcher, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh workspace nextL
gesture = 3, left, dispatcher, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh workspace nextR
gesture = 3, up, dispatcher, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh workspace nextD
gesture = 3, down, dispatcher, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh workspace nextU

# Перемещение окна между рабочими столами матрицы
gesture = 3, right, mod: SUPER CTRL ALT, dispatcher, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh movetoworkspace nextL
gesture = 3, left, mod: SUPER CTRL ALT, dispatcher, exec,  ~/.config/Vidgex-Shell/scripts/matrix_nav.sh movetoworkspace nextR
gesture = 3, up, mod: SUPER CTRL ALT, dispatcher, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh movetoworkspace nextD
gesture = 3, down, mod: SUPER CTRL ALT, dispatcher, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh movetoworkspace nextU

# Работа с панелью
gesture = 4, pinchout, dispatcher, exec, fabric-cli exec vidgex-shell 'notch.toggle_notch("launcher")'
gesture = 4, up, dispatcher, exec, fabric-cli exec vidgex-shell 'notch.close_notch()'

# Смена фокуса
gesture = 4, right, dispatcher, movefocus, l
gesture = 4, left, dispatcher, movefocus, r

# Изменение положения окна в фокусе на конкретном рабочем столе
gesture = 4, right, mod: ALT SUPER, dispatcher, layoutmsg, swapcol l
gesture = 4, left, mod: ALT SUPER, dispatcher, layoutmsg, swapcol r
