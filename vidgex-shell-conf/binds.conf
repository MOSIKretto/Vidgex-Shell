#################################
### НАСТРОЙКИ ГОРЯЧИХ КЛАВИШЬ ###
#################################

# Переключение между рабочими столами 1-9
bind = ALT, 1, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh workspace 1
bind = ALT, 2, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh workspace 2
bind = ALT, 3, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh workspace 3
bind = ALT, 4, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh workspace 4
bind = ALT, 5, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh workspace 5
bind = ALT, 6, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh workspace 6
bind = ALT, 7, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh workspace 7
bind = ALT, 8, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh workspace 8
bind = ALT, 9, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh workspace 9

# Матричное переключение рабочих столов
bind = ALT, right, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh workspace nextR
bind = ALT, left, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh workspace nextL
bind = ALT, up, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh workspace nextU
bind = ALT, down, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh workspace nextD

# Перетащить окно, которое в фокусе на конкретный рабочий стол
bind = CTRL ALT, 1, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh movetoworkspace 1
bind = CTRL ALT, 2, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh movetoworkspace 2
bind = CTRL ALT, 3, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh movetoworkspace 3
bind = CTRL ALT, 4, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh movetoworkspace 4
bind = CTRL ALT, 5, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh movetoworkspace 5
bind = CTRL ALT, 6, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh movetoworkspace 6
bind = CTRL ALT, 7, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh movetoworkspace 7
bind = CTRL ALT, 8, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh movetoworkspace 8
bind = CTRL ALT, 9, exec, ~/.config/Vidgex-Shell/scripts/jump_matrix.sh movetoworkspace 9

# Перемещение окна между рабочими столами матрицы
bind = CTRL ALT, right, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh movetoworkspace nextR
bind = CTRL ALT, left, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh movetoworkspace nextL
bind = CTRL ALT, up, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh movetoworkspace nextU
bind = CTRL ALT, down, exec, ~/.config/Vidgex-Shell/scripts/matrix_nav.sh movetoworkspace nextD

# Работа с Shell
bind = SUPER SHIFT, W, exec, fabric-cli exec vidgex-shell 'notch.dashboard.wallpapers.random_wall(None, ext=True)' # Random Wallpaper
bind = SUPER SHIFT, E, exec, fabric-cli exec vidgex-shell 'notch.toggle_notch("power")' # Power Menu
bind = SUPER SHIFT, R, exec, killall vidgex-shell; python3 ~/.config/Vidgex-Shell/main.py; fabric-cli exec vidgex-shell 'app.set_css()' # Reload Vidgex-shell & Reload CSS

bind = ALT, Q, exec, fabric-cli exec vidgex-shell 'notch.toggle_notch("dashboard")' # Dashboard
bind = ALT, W, exec, fabric-cli exec vidgex-shell 'notch.toggle_notch("network_applet")' # WI-FI
bind = ALT, E, exec, fabric-cli exec vidgex-shell 'notch.toggle_notch("bluetooth")' # Bluetooth
bind = ALT, R, exec, fabric-cli exec vidgex-shell 'notch.toggle_notch("wallpapers")' # Wallpapers
bind = ALT, T, exec, fabric-cli exec vidgex-shell 'notch.toggle_notch("mixer")' # Audio Mixer
bind = ALT, A, exec, fabric-cli exec vidgex-shell 'notch.toggle_notch("overview")' # Overview
bind = ALT, S, exec, fabric-cli exec vidgex-shell 'notch.toggle_notch("cliphist")' # Clipboard History

bind = , PRINT, exec, fabric-cli exec vidgex-shell 'notch.toggle_notch("tools")' # Toolbox
bind = SUPER, SPACE, exec, fabric-cli exec vidgex-shell 'notch.toggle_notch("launcher")' # App Launcher

# Изменение яркости и звука
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-