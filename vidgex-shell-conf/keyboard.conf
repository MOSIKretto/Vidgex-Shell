### Раскладка ###
#################

input {
    kb_layout = us, ru
    kb_options = grp:caps_toggle
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = yes
        disable_while_typing = true
        middle_button_emulation = true
        tap-to-click = true
        drag_lock = true
    }
}